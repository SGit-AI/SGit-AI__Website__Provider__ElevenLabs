name: build and check

# The site is static and dependency-free, so CI is the only place these
# invariants are enforced. All four jobs are required.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the whole tree, including the built site
        run: tools/secret-scan.sh

  build:
    name: build is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docs/ must match content/
        run: python3 build.py --check

  acceptance:
    name: acceptance assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: non-affiliation, one host, nine sections, every claim cited
        run: python3 tools/check_site.py

  scripts:
    name: lab javascript parses and passes its own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: tools/check-js.sh
      - name: lab.js self-test in a browser (no network used)
        # test-labs.sh finds chromium or google-chrome itself, and fails loudly
        # if the runner image has neither — a skipped test is worse than a red one.
        run: tools/test-labs.sh
