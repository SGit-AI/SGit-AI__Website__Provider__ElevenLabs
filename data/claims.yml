# The ledger. Every factual claim the site makes lives here once, with the state
# it earned and the date it earned it. Pages cite a claim with {{claim:id}}, which
# renders the chip and links back to /ledger/. The "where it is said" column is
# joined at build time, so a claim cannot quietly appear on a page unbadged.
#
# States: verified · measured · docs · spec · unrun · projected  (see build.py STATES)

- id: cors-browser
  state: verified
  date: 5 Sep 2026
  group: Verified in a browser, 5 September 2026
  claim: "`api.elevenlabs.io` answers CORS for browser origins directly. `GET /user/subscription`, `/voices`, `/models` and `POST /text-to-speech/{id}/with-timestamps` all returned 200 from a `null`-origin srcdoc iframe. No proxy is needed for a browser-side lab."
  source: "The project lead's browser, SG/Vault app frame"

