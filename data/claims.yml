- id: csp-blocks
  state: verified
  date: 5 Sep 2026
  group: Verified in a browser, 5 September 2026
  claim: "Inside the SG/App host, every app frame is served `connect-src blob: data:`, so the bench's first `fetch` was refused before it left the frame. `\"permissions\": {\"network\": true}` in `app.json` omits that meta and the host's HUD then shows a standing \"direct network access\" chip."
  source: "Console error, then the fix, on the same afternoon"

- id: egress-blocked
  state: verified
  date: 4–5 Sep 2026
  group: Verified in a browser, 5 September 2026
  claim: "`api.elevenlabs.io:443` is refused to the authoring container by the agent proxy (`connect_rejected`, organization policy) — from curl and from Node, on the regional hosts too. Nothing written in that container could be executed there."
  source: "curl and node, both refused"

- id: keys-local-only
  state: verified
  date: 7 Sep 2026
  group: Verified in a browser, 5 September 2026
  claim: "A key typed into any lab on this site is kept in this browser's `localStorage` (or `sg.state` inside a vault app) and is sent to exactly one host, `api.elevenlabs.io`, in the `xi-api-key` header. There is no other network origin in the built site."
  source: "Enforced by tools/check_site.py, a required CI check, over the built HTML and JS"

