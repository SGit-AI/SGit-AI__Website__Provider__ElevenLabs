- id: pipeline-drift
  state: measured
  date: 3 Sep 2026
  group: Measured on our own workloads
  claim: "Those renders drifted **100–500 ms over two minutes** between the audio and the recording, and the cause has never been attributed. Character-level alignment makes the attribution possible for the first time — sum the alignments' last end times and compare with the recorder's own duration — and it has not been done."
  source: "Render logs across four reels; the comparison is ten minutes of work nobody has spent"

- id: mp4-vs-webm
  state: measured
  date: 7 Sep 2026
  group: Measured on our own workloads
  claim: "For the same two minutes of video the MP4 was **3.7 MB against 10.1 MB** for the WebM. MP4 also plays natively on iOS Safari and is accepted by messaging apps that refuse WebM, so the delivered file is H.264 + AAC with `+faststart`."
  source: "The pipeline's own encodes"

- id: first-run-risks
  state: unrun
  group: Specified, or written and never run
  claim: "Four predictions about where the unrun ElevenLabs render path breaks first: `pcm_44100` output is gated to higher plans and is the most likely failure; `eleven_v3` may not be enabled for API use, and treats stability as three discrete modes rather than a continuum, so an arbitrary value can 422; the alignment may not come back in the shape the shim expects, or at all on some models; and the render's default pool fires two generations at once against an untested concurrency limit."
  source: "Reasoned from the vendor's reference by the pipeline's author, who could not reach the API. Predictions, not findings"

